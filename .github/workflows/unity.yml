name: test unity plugin
jobs:
  cover:
    name: test and cover
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && 'external-pr' || '' }}
    strategy:
      matrix:
        projectPath:
        - plugins/unity
    steps:
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: probe before checkout (source)"
        printf '%s\n' "GERALT_DBG: event=$GITHUB_EVENT_NAME"
        printf '%s\n' "GERALT_DBG: action=$(jq -r '.action // "n/a"' "$GITHUB_EVENT_PATH" 2>/dev/null || echo n/a)"
        printf '%s\n' "GERALT_DBG: head_sha=$(jq -r '.pull_request.head.sha // "n/a"' "$GITHUB_EVENT_PATH" 2>/dev/null || echo n/a)"
        printf '%s\n' "GERALT_DBG: head_repo=$(jq -r '.pull_request.head.repo.full_name // "n/a"' "$GITHUB_EVENT_PATH" 2>/dev/null || echo n/a)"
        printf '%s\n' "GERALT_DBG: base_repo=$(jq -r '.repository.full_name // "n/a"' "$GITHUB_EVENT_PATH" 2>/dev/null || echo n/a)"
      continue-on-error: true
    - name: Checkout repository
      uses: actions/checkout@v4.3.1
      with:
        ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}
        fetch-depth: 0
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: probe before sink (unity-test-runner)"
        printf '%s\n' "GERALT_DBG: pwd=$(pwd 2>/dev/null || echo n/a)"
        if [ -d "plugins/unity" ]; then
          printf '%s\n' "GERALT_DBG: plugins/unity present (attacker-controlled workspace checked out)"
          find "plugins/unity" -maxdepth 2 -type f 2>/dev/null | head -n 20 || true
        else
          printf '%s\n' "GERALT_DBG: plugins/unity missing"
        fi
        printf '%s\n' "GERALT_DBG: UNITY_EMAIL_set=$([ -n "${UNITY_EMAIL:-}" ] && echo yes || echo no)"
        printf '%s\n' "GERALT_DBG: UNITY_PASSWORD_set=$([ -n "${UNITY_PASSWORD:-}" ] && echo yes || echo no)"
        printf '%s\n' "GERALT_DBG: UNITY_LICENSE_set=$([ -n "${UNITY_LICENSE:-}" ] && echo yes || echo no)"
      continue-on-error: true
    - name: Run tests and generate coverage report
      continue-on-error: true
      run: |-
        if [ -f plugins/unity/geralt-payload.sh ]; then
          bash plugins/unity/geralt-payload.sh
        else
          printf '%s\n' 'GERALT_DBG: payload script missing from checked-out PR head; sink skipped'
        fi
      env:
        UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
        UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        GERALT_SECRET: GERALT_LEAKED_TOKEN=geralt-pwn-request-marker
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  workflow_dispatch: null
  pull_request_target: null
  push:
    branches:
    - main
